cubes:
  - name: sales

    sql: >
      SELECT
        s.sale_id,
        s.sale_date,
        s.customer_id,
        s.product_id,
        p.product_name,
        s.region,
        s.quantity,
        s.unit_price,
        s.discount,
        s.revenue,
        s.cost
      FROM sales s
      LEFT JOIN products p
        ON s.product_id = p.product_id

    measures:
      - name: revenue
        sql: revenue
        type: sum

      - name: cost
        sql: cost
        type: sum

      - name: profit
        sql: revenue - cost
        type: sum

      - name: margin
        sql: >
          CASE
            WHEN SUM(revenue) = 0 THEN 0
            ELSE (SUM(revenue) - SUM(cost)) / SUM(revenue)
          END
        type: number

    dimensions:
      - name: sale_id
        sql: sale_id
        type: string
        primary_key: true

      - name: date
        sql: sale_date
        type: time

      - name: customer_id
        sql: customer_id
        type: string

      - name: product_id
        sql: product_id
        type: string

      - name: product
        sql: product_name
        type: string

      - name: region
        sql: region
        type: string
