cubes:
  - name: sales
    sql: >
      SELECT
        s.sale_id,
        s.sale_date,
        EXTRACT(YEAR FROM s.sale_date)::integer AS year,
        CONCAT('Q', EXTRACT(QUARTER FROM s.sale_date)::integer, ' ', EXTRACT(YEAR FROM s.sale_date)::integer) AS quarter,
        TO_CHAR(s.sale_date, 'YYYY-MM') AS month,
        s.customer_id,
        c.customer_name,
        c.country,
        c.customer_segment,
        s.product_id,
        p.product_name AS product,
        p.category,
        p.tier,
        s.region,
        s.quantity,
        s.unit_price,
        s.discount,
        s.revenue,
        s.cost,
        s.profit,
        s.margin,
        ROUND((s.cost * 0.75)::numeric, 2) AS material_cost,
        ROUND((s.cost * 0.25)::numeric, 2) AS shipping_cost
      FROM sales s
      LEFT JOIN products p ON s.product_id = p.product_id
      LEFT JOIN customers c ON s.customer_id = c.customer_id
      LEFT JOIN customer_status cs ON s.customer_id = cs.customer_id

    measures:
      - name: revenue
        title: "Total Revenue"
        sql: revenue
        type: sum
        format: currency

      - name: cost
        title: "Total Cost"
        sql: cost
        type: sum
        format: currency

      - name: profit
        title: "Operating Profit"
        sql: profit
        type: sum
        format: currency

      - name: margin
        title: "Operating Margin"
        sql: profit
        type: sum
        format: currency

      - name: margin_pct
        title: "Margin Percentage"
        sql: >
          CASE
            WHEN SUM(revenue) = 0 THEN 0
            ELSE (SUM(profit) / SUM(revenue)) * 100
          END
        type: number
        format: percent

      - name: quantity
        title: "Quantity Sold"
        sql: quantity
        type: sum

      - name: material_cost
        title: "Material Cost"
        sql: material_cost
        type: sum
        format: currency

      - name: shipping_cost
        title: "Shipping Cost"
        sql: shipping_cost
        type: sum
        format: currency

      - name: customer_count
        title: "Customer Count"
        sql: customer_id
        type: count_distinct

      - name: transaction_count
        title: "Transaction Count"
        type: count

    dimensions:
      - name: sale_id
        sql: sale_id
        type: string
        primary_key: true

      - name: date
        sql: sale_date
        type: time

      - name: year
        sql: year
        type: number

      - name: quarter
        sql: quarter
        type: string

      - name: month
        sql: month
        type: string

      - name: region
        sql: region
        type: string

      - name: country
        sql: country
        type: string

      - name: product
        sql: product
        type: string

      - name: category
        sql: category
        type: string

      - name: tier
        sql: tier
        type: string

      - name: customer_segment
        sql: customer_segment
        type: string

      - name: customer_name
        sql: customer_name
        type: string
