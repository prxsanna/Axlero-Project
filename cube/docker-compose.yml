version: '3.8'

services:
  cube:
    image: cubejs/cube:v1.7.30
    ports:
      - "4000:4000"  # Cube REST/GraphQL API & Developer Playground
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=host.docker.internal
      - CUBEJS_DB_PORT=${CUBEJS_DB_PORT:-5432}
      - CUBEJS_DB_NAME=${CUBEJS_DB_NAME:-metricmind}
      - CUBEJS_DB_USER=${CUBEJS_DB_USER:-postgres}
      - CUBEJS_DB_PASS=${CUBEJS_DB_PASS:-}
      - CUBEJS_DEV_MODE=true
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET:-metricmind_secret_cube_token_12345}
    volumes:
      - .:/cube/conf
